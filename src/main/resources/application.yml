spring:
  application:
    name: FluxoOS
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/fluxoos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/{vendor}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
  tomcat:
    max-http-form-post-size: 512KB

fluxoos:
  cookie-secure: ${COOKIE_SECURE:false}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  bootstrap-admin-master: ${BOOTSTRAP_ADMIN_MASTER:false}
  demo: ${DEMO_DATA:false}
  seguranca:
    max-sessoes: ${MAX_SESSOES:20}
    erros-usuario: ${LOGIN_MAX_ERROS:5}
    erros-ip: ${LOGIN_MAX_ERROS_IP:30}
    janela-minutos: ${LOGIN_JANELA_MINUTOS:15}
    bloqueio-minutos: ${LOGIN_BLOQUEIO_MINUTOS:5}
    max-identificadores: ${LOGIN_MAX_IDENTIFICADORES:10000}
    limpeza-intervalo-ms: ${SEGURANCA_LIMPEZA_MS:60000}

logging:
  level:
    org.springframework.web: INFO
