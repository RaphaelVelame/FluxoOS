spring.application.name=FluxoOS
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/fluxoos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.tomcat.max-http-form-post-size=512KB
fluxoos.cookie-secure=${COOKIE_SECURE:false}
fluxoos.bootstrap-password=${BOOTSTRAP_PASSWORD:}
fluxoos.demo=${DEMO_DATA:false}
spring.web.resources.cache.cachecontrol.no-cache=true
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
