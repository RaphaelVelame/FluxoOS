name: Validar FluxoOS
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fluxoos_test
          POSTGRES_USER: fluxoos
          POSTGRES_PASSWORD: fluxoos-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxoos -d fluxoos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: sh ./mvnw --batch-mode verify
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Validar gravação e recuperação da interface
        run: npm test
        working-directory: tests/e2e
      - name: Validar fluxo operacional no PostgreSQL
        run: sh ./mvnw --batch-mode -Dtest=FluxoOperacionalTest,RevogacaoSessaoTest,MigracaoSessaoTest,LimitesLoginTest,IntegridadeSchemaTest,PropriedadeEstoqueTest,MultiTenantRbacTest,MigracaoMultiTenantTest test
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/fluxoos_test
          TEST_DATABASE_USER: fluxoos
          TEST_DATABASE_PASSWORD: fluxoos-ci-only
          TEST_DATABASE_DISPOSABLE: 'true'
